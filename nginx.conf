# Plain HTTP — redirect everything to HTTPS, except the ACME challenge path
# certbot uses for certificate renewal.
server {
    listen 80;
    server_name ciboreale.com www.ciboreale.com;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ciboreale.com www.ciboreale.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ciboreale.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciboreale.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow uploads up to the backend's own 10MB media limit.
    client_max_body_size 12M;

    # Reverse proxy API calls to the backend container.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media files served by the backend. Needs ^~ so this prefix
    # wins over the generic image-extension regex location below — without
    # it, nginx's regex-location-precedence rule matches uploaded .png/.jpg
    # files here first and tries to serve them from this container's own
    # (nonexistent) /uploads folder instead of proxying to the backend,
    # producing a 404 for every uploaded image while non-matching
    # extensions like .pdf worked fine.
    location ^~ /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
    }

    # Hashed build assets (Vite emits content-hashed filenames) — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hero scroll-animation frames — large, static, never change. Cache long.
    location ~* ^/hero-frames.*/.*\.webp$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static media (fonts, images, svg). Content is stable enough to cache.
    location ~* \.(?:webp|jpg|jpeg|png|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback — let React Router handle client-side routes.
    # index.html itself must never be cached, or clients pin a stale bundle.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
